<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6bfd7">
  <meta name="description" content="A little birthday surprise, waiting just for you.">
  <title>A Special Day Is Coming · Birthday Surprise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink:#e91e63;--pink-300:#f48fb1;--gold:#f5c542;--gold-deep:#8b6508;
      --ink:#4a1e4a;--ink-soft:#6a4a6a;--glass:rgba(255,255,255,.55);
      --spring:cubic-bezier(.175,.885,.32,1.275);--soft:cubic-bezier(.22,1,.36,1)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow:hidden}
    body{font-family:Quicksand,sans-serif;color:var(--ink);background:#edafca}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,.phone-slot:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
    button[hidden],div[hidden]{display:none!important}

    /* ===== After-window phase: hide chest, lock and key ===== */
    body.phase-after .phone-slot,
    body.phase-after .key,
    body.phase-after .lock-button,
    body.phase-after .lock-glow,
    body.phase-after .manage-button,
    body.phase-after .auto-badge {
      display: none !important;
    }

    /* ===== Stage & Layer ===== */
    .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;isolation:isolate}
    .backdrop{position:absolute;inset:-60px;background:url('Background.jpg') center/cover no-repeat;filter:blur(50px) saturate(1.4) brightness(1.05);transform:scale(1.08)}
    .layer{position:relative;aspect-ratio:1536/1024;width:min(100vw,calc(100vh * 1536 / 1024));height:auto;container-type:inline-size;container-name:layer;z-index:1;box-shadow:0 0 50px rgba(89,20,67,.14);overflow:hidden}
    .bg-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}

    /* ===== Countdown ===== */
    .countdown{position:absolute;z-index:2;left:50%;top:26.5%;transform:translate(-50%,-50%);width:52%;height:11%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;border-radius:999px;background:linear-gradient(135deg,#fde7f0,#fbd0e3 50%,#f9c0d8);border:.35cqw solid white;box-shadow:0 .65cqw 2.2cqw rgba(197,59,130,.3),inset 0 .25cqw .4cqw rgba(255,255,255,.95);overflow:hidden}
    .time-cell{text-align:center;min-width:0;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw}
    .time-cell+.time-cell{border-left:1px solid rgba(186,83,135,.3)}
    .time-number{font:700 4.8cqw/1 Caveat,cursive;color:var(--ink);font-variant-numeric:tabular-nums}
    .time-label{font:700 1.35cqw/1 Quicksand,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

    /* ===== Lock glow ===== */
    .lock-glow{position:absolute;left:50%;top:66.5%;transform:translate(-50%,-50%);width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.85),rgba(255,215,0,.45) 30%,rgba(255,215,0,0) 70%);opacity:0;pointer-events:none;z-index:2;transition:opacity .35s ease}
    .lock-glow.pulse{animation:glowPulse 2s ease-in-out infinite}
    .lock-glow.active{opacity:1;animation:none}
    .lock-glow.burst{animation:glowBurst .9s ease-out forwards}
    @keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:.8}}
    @keyframes glowBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}

    /* ===== Glass buttons ===== */
    .glass-btn{position:absolute;z-index:10;display:grid;place-items:center;width:clamp(36px,4.3cqw,62px);height:clamp(36px,4.3cqw,62px);border-radius:50%;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 6px 20px rgba(150,80,120,.2),inset 0 1px 2px rgba(255,255,255,.9);color:var(--ink);transition:transform .2s,background .2s}
    .glass-btn:hover{transform:scale(1.08);background:rgba(255,255,255,.8)}
    .glass-btn svg{width:55%;height:55%;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lock-button{left:3%;top:5%}
    .music-button{right:3%;top:5%}
    .manage-button{left:3%;bottom:5%}
    .auto-badge{position:absolute;right:3%;bottom:5%;z-index:8;padding:.7cqw 1.3cqw;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,238,247,.85);backdrop-filter:blur(12px);font-size:clamp(9px,1.15cqw,16px);font-weight:700;box-shadow:0 3px 12px rgba(150,80,120,.18)}

    /* ===== Key ===== */
    .key{position:absolute;z-index:8;left:86%;top:62%;width:6cqw;aspect-ratio:60/100;opacity:0;pointer-events:none;touch-action:none;filter:drop-shadow(0 .5cqw .6cqw rgba(91,38,15,.55));transform:translate(-50%,-50%) scale(.4) rotate(25deg);transition:left .5s var(--spring),top .5s var(--spring),transform .5s var(--spring),opacity .5s}
    .key.visible{opacity:1;pointer-events:auto;cursor:grab;transform:translate(-50%,-50%) scale(1);animation:keyFloat 3s ease-in-out infinite}
    .key.dragging{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);animation:none;transition:none;cursor:grabbing}
    .key.snapping{opacity:1;pointer-events:none;transform:translate(-50%,-50%) scale(.7) rotate(0deg);animation:none;transition:left .4s var(--spring),top .4s var(--spring),transform .5s ease}
    .key.rotating{opacity:1;animation:keyRotateWiggle .9s ease-in-out forwards}
    .key.gone{opacity:0;animation:none;transform:translate(-50%,-50%) scale(.3) rotate(90deg);transition:transform .4s ease,opacity .4s ease}
    @keyframes keyFloat{0%,100%{transform:translate(-50%,-50%) translateY(-1%) rotate(-4deg)}50%{transform:translate(-50%,-50%) translateY(1%) rotate(4deg)}}
    @keyframes keyRotateWiggle{0%{transform:translate(-50%,-50%) scale(.7) rotate(0deg)}25%{transform:translate(-50%,-50%) scale(.7) rotate(30deg)}50%{transform:translate(-50%,-50%) scale(.7) rotate(60deg)}75%{transform:translate(-50%,-50%) scale(.7) rotate(80deg)}100%{transform:translate(-50%,-50%) scale(.7) rotate(90deg)}}

    /* ===== Phone slot ===== */
    .phone-slot{position:absolute;left:50%;top:68%;width:11cqw;aspect-ratio:9/19.5;transform:translate(-50%,-50%) scale(0);z-index:5;pointer-events:none;opacity:0;perspective:800px;border:0;background:none;padding:0}
    .phone-3d{position:relative;width:100%;height:100%;transform-style:preserve-3d}
    .phone-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:15% / 7%;padding:4%;background:linear-gradient(90deg,#3a1a35 0%,#5a2a4a 3%,#8a4a7a 5%,#5a2a4a 7%,#2a0c22 15%,#2a0c22 85%,#5a2a4a 93%,#8a4a7a 95%,#5a2a4a 97%,#3a1a35 100%);box-shadow:inset 0 0 0 .25cqw rgba(255,220,240,.15),inset 0 .3cqw .6cqw rgba(255,200,230,.28),inset 0 -.3cqw .6cqw rgba(0,0,0,.5),0 .8cqw 2.4cqw rgba(0,0,0,.55),0 0 3cqw rgba(255,215,0,.35);display:flex}
    .home-wallpaper{flex:1;border-radius:13% / 6%;background:linear-gradient(160deg,#4a1a3f,#2e0824 40%,#3a1450 70%,#1a0416);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%}
    .phone-island{position:absolute;top:3.5%;left:50%;transform:translateX(-50%);width:34%;height:4.8%;background:#000;border-radius:999px;z-index:5}
    .home-heart{font-size:8cqw;color:#ff80ab;text-shadow:0 0 1cqw #ff80ab,0 0 2cqw #e91e63,0 0 3cqw rgba(233,30,99,.6);animation:heartPulse 2s ease-in-out infinite}
    .home-text{font:700 3.2cqw Caveat,cursive;color:rgba(255,220,240,.9);text-shadow:0 0 .5cqw rgba(255,128,171,.7);white-space:nowrap}
    .home-dots{position:absolute;bottom:6%;display:flex;gap:.6cqw}
    .dot{width:.5cqw;height:.5cqw;border-radius:50%;background:rgba(255,255,255,.35)}
    .dot.active{background:rgba(255,220,240,.95);box-shadow:0 0 .4cqw rgba(255,200,230,.8)}
    @keyframes heartPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
    .phone-back{transform:rotateY(180deg);background:linear-gradient(145deg,#4a1a3f,#3a1450 30%,#2e0824 60%,#1a0416)}
    .camera-module{position:absolute;top:6%;left:6%;width:48%;aspect-ratio:1;border-radius:28%;background:linear-gradient(145deg,#3a2a3a,#1a0a1a);box-shadow:inset 0 .2cqw .4cqw rgba(255,255,255,.1),inset 0 -.15cqw .3cqw rgba(0,0,0,.9),0 .4cqw 1cqw rgba(0,0,0,.6);padding:10%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10%}
    .lens{border-radius:50%;background:radial-gradient(circle at 30% 30%,#4a6a8a,#1a2a3a 40%,#050510);box-shadow:inset 0 .15cqw .3cqw rgba(120,180,240,.7),0 0 .2cqw rgba(0,0,0,.8);position:relative}
    .lens:after{content:'';position:absolute;top:20%;left:20%;width:30%;height:30%;border-radius:50%;background:radial-gradient(circle,rgba(200,230,255,.8),transparent 70%)}
    .lens-1{grid-column:1;grid-row:1}
    .lens-2{grid-column:2;grid-row:1}
    .lens-3{grid-column:1;grid-row:2}
    .flash{grid-column:2;grid-row:2;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe8c0,#d4a020 50%,#8b6508);box-shadow:inset 0 0 .15cqw rgba(255,240,180,.9),0 0 .2cqw rgba(255,200,100,.5)}
    .apple-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20%;height:20%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#a07090,#5a2a4a);box-shadow:inset 0 0 .2cqw rgba(255,255,255,.15);opacity:.7}
    .phone-slot.reveal{opacity:1;animation:phoneRise 2.2s cubic-bezier(.22,.8,.36,1) forwards;pointer-events:auto;cursor:pointer}
    .phone-slot.reveal .phone-3d{animation:spinPhone 2.2s cubic-bezier(.22,.8,.36,1) forwards}
    @keyframes phoneRise{0%{top:68%;transform:translate(-50%,-50%) scale(.2)}100%{top:52%;transform:translate(-50%,-50%) scale(1)}}
    @keyframes spinPhone{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
    .phone-slot.done{top:52%;transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;cursor:pointer;animation:phoneFloat 3.5s ease-in-out infinite}
    @keyframes phoneFloat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.015)}}

    /* ===== Modals ===== */
    .modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:rgba(20,7,24,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility .22s ease}
    .modal.open{opacity:1;visibility:visible;pointer-events:auto}
    .dialog{position:relative;width:min(100%,380px);max-height:100%;overflow:auto;padding:32px 28px;border:1px solid rgba(255,255,255,.8);border-radius:22px;background:linear-gradient(155deg,rgba(255,245,250,.96),rgba(249,204,227,.93));box-shadow:0 22px 70px rgba(26,5,27,.35),inset 0 1px 0 white;text-align:center}
    .dialog h2{font:700 36px/1.1 Caveat,cursive;margin:4px 0 10px}
    .dialog p{color:var(--ink-soft);font-size:13px;line-height:1.5}
    .dialog form{display:grid;gap:12px;margin-top:22px}
    .dialog label{text-align:left;font-weight:700;font-size:12px}
    .dialog input{width:100%;height:46px;margin-top:6px;padding:0 14px;border:1px solid #d9a9c1;border-radius:10px;background:rgba(255,255,255,.8);color:var(--ink);outline:none}
    .dialog input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(233,30,99,.14)}
    .primary-btn{min-height:46px;border:0;border-radius:10px;background:var(--pink);color:white;font-weight:700;box-shadow:0 6px 15px rgba(233,30,99,.25)}
    .text-btn{border:0;background:none;color:var(--ink-soft);text-decoration:underline;font-size:12px;padding:8px}
    .error{color:#c21b4f!important;min-height:18px;margin:0!important;visibility:hidden}
    .error.show{visibility:visible}
    .shake{animation:shake .35s}
    @keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
    .close-btn{position:absolute;right:12px;top:10px;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.5);color:var(--ink);font-size:25px;line-height:1}

    /* ===== Viewer ===== */
    .viewer{background:rgba(0,0,0,.82)}
    .viewer-close{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:3;width:44px;height:44px;color:white;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px)}
    .viewer-device{position:relative;width:min(82vw,320px,calc((100dvh - 120px) * .48));aspect-ratio:9/19.5;border:5px solid #5d425d;border-radius:12% / 5.5%;padding:7px;background:#1c1020;box-shadow:0 0 0 2px #a57b9d,0 35px 85px rgba(0,0,0,.6),0 0 65px rgba(245,197,66,.15);overflow:hidden}
    .viewer-screen{position:relative;width:100%;height:100%;border-radius:9% / 4%;background:linear-gradient(160deg,#401835,#1b0b24 55%,#301038);overflow:hidden;color:white}
    .viewer-island{position:absolute;z-index:3;left:50%;top:9px;transform:translateX(-50%);width:34%;height:18px;border-radius:99px;background:#08070a}
    .status{position:absolute;z-index:2;top:13px;left:8%;right:7%;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
    .battery{width:17px;height:9px;border:1.5px solid white;border-radius:2px;display:inline-block;position:relative;margin-left:5px}
    .battery:before{content:'';position:absolute;inset:1.5px 3px 1.5px 1.5px;background:white}
    .battery:after{content:'';position:absolute;right:-4px;top:2px;width:2px;height:3px;background:white}
    
    /* ===== Viewer Content & Native Video ===== */
    .viewer-content{position:absolute;inset:50px 10px 68px;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:#100b14}
    .viewer-content video { width: 100%; height: 100%; object-fit: contain; background: #100b14; }
    
    .buffering-spinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:rgba(0,0,0,.35);pointer-events:none;z-index:2;font-size:12px;font-weight:600}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#f48fb1;border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .video-controls{position:absolute;left:10px;right:10px;bottom:24px;z-index:3;display:flex;flex-direction:column;gap:6px}
    .timeline{width:100%;height:17px;margin:0;accent-color:#f48fb1;cursor:pointer}
    .control-row{display:flex;align-items:center;justify-content:space-between;gap:3px}
    .control-row button{display:grid;place-items:center;min-width:31px;height:30px;padding:0 4px;color:white;border:0;background:none;font-size:17px}
    .control-row button:hover{color:#f48fb1}
    .control-row .time-readout{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.85}
    .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:33%;height:4px;border-radius:99px;background:white}

    /* ===== Toast ===== */
    .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,20px);width:max-content;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:99px;background:rgba(74,30,74,.93);color:white;text-align:center;font-size:13px;font-weight:700;box-shadow:0 9px 25px rgba(40,10,35,.3);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @container layer (max-width:600px){
      .countdown{height:12%}
      .time-label{font-size:1.65cqw}
      .auto-badge{max-width:28%;line-height:1.25;text-align:center}
      .key{width:8cqw}
      .phone-slot{width:14cqw}
    }
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
      .phone-slot.reveal{top:52%;transform:translate(-50%,-50%) scale(1);opacity:1}
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Birthday surprise">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="layer" id="layer">
      <img class="bg-image" src="Background.jpg" alt="A birthday room with an illustrated girl, pets, presents and a treasure chest" fetchpriority="high">

      <!-- Countdown -->
      <div class="countdown" role="timer" aria-label="Time until the birthday" id="countdown">
        <div class="time-cell"><span class="time-number" id="days">00</span><span class="time-label">Days</span></div>
        <div class="time-cell"><span class="time-number" id="hours">00</span><span class="time-label">Hours</span></div>
        <div class="time-cell"><span class="time-number" id="minutes">00</span><span class="time-label">Minutes</span></div>
        <div class="time-cell"><span class="time-number" id="seconds">00</span><span class="time-label">Seconds</span></div>
      </div>

      <!-- Glow & top buttons -->
      <div class="lock-glow" id="glow" aria-hidden="true"></div>
      <button class="glass-btn lock-button" id="btn-lock" type="button" aria-label="Open secret password">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button class="glass-btn music-button" id="btn-music" type="button" aria-label="Mute music" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      </button>
      <button class="glass-btn manage-button" id="btn-key-manage" type="button" aria-label="Change secret" hidden>
        <svg viewBox="0 0 24 24"><circle cx="7" cy="15" r="4"/><path d="M11 15h10m-3 0v-3m-3 3v-3"/></svg>
      </button>
      <div class="auto-badge" id="auto-badge" hidden>🎉 Auto-unlock is active!</div>

      <!-- Golden key -->
      <div class="key" id="key" role="button" tabindex="-1" aria-label="Drag golden key to the lock">
        <svg viewBox="0 0 60 100" width="100%" height="100%" aria-hidden="true">
          <defs>
            <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff3c4"/><stop offset="25%" stop-color="#f5c542"/>
              <stop offset="65%" stop-color="#d4a017"/><stop offset="100%" stop-color="#8b6508"/>
            </linearGradient>
            <radialGradient id="jewelGrad" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffb0d0"/><stop offset="60%" stop-color="#e91e63"/><stop offset="100%" stop-color="#8b0a2a"/>
            </radialGradient>
          </defs>
          <path d="M30 3 C15 3 3 13 3 26 C3 40 18 52 30 62 C42 52 57 40 57 26 C57 13 45 3 30 3 Z" fill="url(#keyGrad)" stroke="#8b6508" stroke-width=".8"/>
          <circle cx="30" cy="26" r="11" fill="url(#jewelGrad)"/>
          <circle cx="26" cy="22" r="3.5" fill="rgba(255,255,255,.7)"/>
          <circle cx="26" cy="22" r="1.5" fill="#fff"/>
          <rect x="26" y="62" width="8" height="30" rx="3" fill="url(#keyGrad)" stroke="#8b6508" stroke-width=".5"/>
          <rect x="34" y="76" width="11" height="5.5" rx="2" fill="url(#keyGrad)" stroke="#8b6508" stroke-width=".5"/>
          <rect x="34" y="86" width="11" height="5.5" rx="2" fill="url(#keyGrad)" stroke="#8b6508" stroke-width=".5"/>
          <circle cx="30" cy="95" r="4.5" fill="url(#keyGrad)" stroke="#8b6508" stroke-width=".6"/>
        </svg>
      </div>

      <!-- Phone slot -->
      <button class="phone-slot" id="phone" type="button" aria-label="Open birthday video">
        <div class="phone-3d">
          <div class="phone-face phone-front">
            <div class="phone-island"></div>
            <div class="home-wallpaper">
              <div class="home-heart">♥</div>
              <div class="home-text">For you 💕</div>
              <div class="home-dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
            </div>
          </div>
          <div class="phone-face phone-back">
            <div class="camera-module">
              <div class="lens lens-1"></div><div class="lens lens-2"></div>
              <div class="lens lens-3"></div><div class="flash"></div>
            </div>
            <div class="apple-logo"></div>
          </div>
        </div>
      </button>
    </div>
  </main>

  <!-- Password modal -->
  <div class="modal" id="password-modal" role="dialog" aria-modal="true" aria-labelledby="password-title">
    <div class="dialog">
      <button class="close-btn" type="button" data-close aria-label="Close">×</button>
      <h2 id="password-title">A little secret…</h2>
      <p id="password-help">Enter the secret to discover what is waiting inside.</p>
      <form id="password-form">
        <label for="pw-input">Secret password<input id="pw-input" type="password" autocomplete="off" required></label>
        <p class="error" id="pw-error" role="alert">That secret doesn't seem right. Try again ♡</p>
        <button class="primary-btn" type="submit">Unlock the surprise</button>
      </form>
      <button class="text-btn" type="button" id="reset-password">Forgot? Reset to default</button>
      <button class="text-btn" type="button" id="password-change" hidden>Change secret instead</button>
    </div>
  </div>

  <!-- Change modal -->
  <div class="modal" id="change-modal" role="dialog" aria-modal="true" aria-labelledby="change-title">
    <div class="dialog">
      <button class="close-btn" type="button" data-close aria-label="Close">×</button>
      <h2 id="change-title">Change your secret</h2>
      <form id="change-form">
        <label for="current-secret">Current secret<input id="current-secret" type="password" required autocomplete="current-password"></label>
        <label for="new-secret">New secret (at least 4 characters)<input id="new-secret" type="password" required minlength="4" autocomplete="new-password"></label>
        <p class="error" id="change-error" role="alert">Check your current secret and try again.</p>
        <button class="primary-btn" type="submit">Save new secret</button>
      </form>
    </div>
  </div>

  <!-- Viewer modal -->
  <div class="modal viewer" id="viewer-modal" role="dialog" aria-modal="true" aria-label="Birthday video viewer">
    <button class="close-btn viewer-close" type="button" data-close aria-label="Close video">×</button>
    <div class="viewer-device">
      <div class="viewer-screen">
        <div class="viewer-island"></div>
        <div class="status">
          <span id="clock">9:41</span>
          <span>●●● <span class="battery" aria-label="Battery"></span></span>
        </div>
        
        <!-- Native Video Element with Optimized Cloudinary URL -->
        <div class="viewer-content">
          <video id="video" playsinline webkit-playsinline preload="auto" controlslist="nodownload" aria-label="Birthday video">
            <source src="https://res.cloudinary.com/xy0tdxyo/video/upload/q_70,w_720/Final.mp4" type="video/mp4">
          </video>
          <div class="buffering-spinner" id="buffering-spinner" hidden>
            <div class="spinner"></div>
            <span>Loading…</span>
          </div>
        </div>
        
        <div class="video-controls">
          <input type="range" class="timeline" id="timeline" min="0" max="1000" value="0" aria-label="Seek video">
          <div class="control-row">
            <button id="skip-back" type="button" aria-label="Back 10 seconds">↶</button>
            <button id="play-pause" type="button" aria-label="Play video">▶</button>
            <button id="skip-forward" type="button" aria-label="Forward 10 seconds">↷</button>
            <span class="time-readout" id="time-readout">0:00 / 0:00</span>
            <button id="mute-video" type="button" aria-label="Mute video">♫</button>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    /* ============================================================
       Utilities
    ============================================================ */
    const $ = id => document.getElementById(id);
    const CFG = {
      SECRET_KEY: 'birthday.secret',
      SESSION_KEY: 'birthday.unlocked',
      DEFAULT_SECRET: '@Aydaaaaaz'
    };
    const lockClosed = '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    const lockOpen   = '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    /* ============================================================
       Schedule: Oct 1 12:00 PM (start) → Oct 3 1:00 AM (end)
       Phases:
         BEFORE  → countdown running to this year's Oct 1 12:00 PM
         WINDOW  → countdown at 00, video accessible
         AFTER   → chest/lock/key hidden, countdown to next year's Oct 1
    ============================================================ */
    const getBirthdayWindow = (year) => ({
      start: new Date(year, 9, 1, 12, 0, 0, 0), // Oct 1 12:00 PM
      end:   new Date(year, 9, 3, 1, 0, 0, 0)   // Oct 3 1:00 AM
    });

    const getScheduleState = () => {
      const now = new Date();
      const year = now.getFullYear();
      const { start, end } = getBirthdayWindow(year);
      if (now < start) return { phase: 'BEFORE', target: start };
      if (now < end)   return { phase: 'WINDOW', target: now };
      const nextYear = getBirthdayWindow(year + 1);
      return { phase: 'AFTER', target: nextYear.start };
    };

    const isAutoUnlockWindow = () => getScheduleState().phase === 'WINDOW';

    /* ============================================================
       State machine
    ============================================================ */
    const State = (() => {
      let current = 'LOCKED';
      const next = {
        LOCKED: ['KEY_VISIBLE', 'KEY_INSERTED'],
        KEY_VISIBLE: ['KEY_INSERTED', 'LOCKED'],
        KEY_INSERTED: ['KEY_ROTATING', 'LOCKED'],
        KEY_ROTATING: ['OPENING', 'LOCKED'],
        OPENING: ['REVEALED', 'LOCKED'],
        REVEALED: ['LOCKED']
      };
      return {
        get: () => current,
        set: value => {
          if (value === current) return true;
          if (!next[current]?.includes(value)) return false;
          current = value;
          return true;
        }
      };
    })();

    /* ============================================================
       Countdown — shows 00 in WINDOW phase, runs to next event otherwise
    ============================================================ */
    const Countdown = (() => {
      const pad = n => String(n).padStart(2, '0');
      const setCells = (d, h, m, s) => {
        [['days', d], ['hours', h], ['minutes', m], ['seconds', s]]
          .forEach(([id, value]) => { $(id).textContent = pad(value); });
      };
      const update = () => {
        const schedule = getScheduleState();

        if (schedule.phase === 'WINDOW') {
          setCells(0, 0, 0, 0);
          $('countdown').setAttribute('aria-label', 'The celebration is live!');
          return;
        }

        const remain = Math.max(0, schedule.target - new Date());
        const days = Math.floor(remain / 86400000);
        const hours = Math.floor((remain % 86400000) / 3600000);
        const minutes = Math.floor((remain % 3600000) / 60000);
        const seconds = Math.floor((remain % 60000) / 1000);
        setCells(days, hours, minutes, seconds);

        const msg = schedule.phase === 'BEFORE'
          ? `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds until the birthday`
          : `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds until next year's birthday`;
        $('countdown').setAttribute('aria-label', msg);
      };
      return { init: () => { update(); setInterval(update, 1000); } };
    })();

    /* ============================================================
       Audio (WebAudio generated melody + SFX)
    ============================================================ */
    const Audio = (() => {
      let ctx, music, muted = false, started = false, loop;
      const melody = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 440, 523.25, 659.25, 880, 659.25, 523.25, 349.23, 523.25, 698.46, 880, 698.46, 523.25, 392, 493.88, 587.33, 783.99, 587.33, 392];
      const bass = [130.81, 110, 174.61, 196];
      const tone = (freq, when, duration = .8, type = 'sine', volume = .06, to) => {
        if (!ctx) return;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, when);
        if (to) osc.frequency.exponentialRampToValueAtTime(to, when + duration);
        gain.gain.setValueAtTime(.0001, when);
        gain.gain.exponentialRampToValueAtTime(volume, when + .005);
        gain.gain.exponentialRampToValueAtTime(.0001, when + duration);
        osc.connect(gain); gain.connect(music || ctx.destination);
        osc.start(when); osc.stop(when + duration + .02);
      };
      const schedule = () => {
        if (!ctx || !started) return;
        const start = ctx.currentTime + .05;
        melody.forEach((n, i) => tone(n, start + i * .3, .8, 'sine', .06));
        bass.forEach((n, i) => tone(n, start + i * 1.8, 1.35, 'triangle', .025));
      };
      const sfx = (from, to, duration = .16, type = 'sine') => {
        if (!ctx) return;
        const osc = ctx.createOscillator(), gain = ctx.createGain(), t = ctx.currentTime;
        osc.type = type; osc.frequency.setValueAtTime(from, t);
        osc.frequency.exponentialRampToValueAtTime(to, t + duration);
        gain.gain.setValueAtTime(.0001, t);
        gain.gain.exponentialRampToValueAtTime(.13, t + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + duration + .02);
      };
      return {
        init: () => {
          if (ctx) return;
          try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            music = ctx.createGain(); music.gain.value = .6; music.connect(ctx.destination);
          } catch (e) { console.warn('Audio unavailable', e); }
        },
        resume: () => {
          if (!ctx) return;
          ctx.resume().catch(() => {});
          if (!started) { started = true; schedule(); loop = setInterval(schedule, 7200); }
        },
        toggle: () => {
          muted = !muted;
          if (music && ctx) music.gain.setTargetAtTime(muted ? 0 : .6, ctx.currentTime, .15);
          $('btn-music').setAttribute('aria-pressed', String(muted));
          $('btn-music').setAttribute('aria-label', muted ? 'Play music' : 'Mute music');
          $('btn-music').style.opacity = muted ? '.5' : '1';
        },
        duckMusic: () => { if (music && !muted) { music.gain.cancelScheduledValues(ctx.currentTime); music.gain.setValueAtTime(music.gain.value, ctx.currentTime); music.gain.linearRampToValueAtTime(0, ctx.currentTime + .3); } },
        unduckMusic: () => { if (music && !muted) { music.gain.cancelScheduledValues(ctx.currentTime); music.gain.setValueAtTime(music.gain.value, ctx.currentTime); music.gain.linearRampToValueAtTime(.6, ctx.currentTime + .5); } },
        sfx: {
          click:  () => sfx(800, 400),
          insert: () => sfx(700, 280, .3),
          rotate: () => sfx(180, 520, .8, 'sawtooth'),
          unlock: () => sfx(180, 900, .45),
          magic:  () => {
            if (!ctx) return;
            [523, 659, 784, 1046].forEach((n, i) => {
              const t = ctx.currentTime + i * .13;
              const osc = ctx.createOscillator(), g = ctx.createGain();
              osc.frequency.value = n; osc.type = 'sine';
              g.gain.setValueAtTime(.0001, t);
              g.gain.exponentialRampToValueAtTime(.11, t + .015);
              g.gain.exponentialRampToValueAtTime(.0001, t + .5);
              osc.connect(g); g.connect(ctx.destination);
              osc.start(t); osc.stop(t + .51);
            });
          }
        }
      };
    })();

    /* ============================================================
       Video module — native HTML5 video with Cloudinary direct URL
       + رفع مشکل نشانگر Loading
    ============================================================ */
    const Video = (() => {
      const video = $('video');
      const spinner = $('buffering-spinner');

      const stamp = n => Number.isFinite(n)
        ? `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, '0')}`
        : '0:00';

      const refresh = () => {
        $('play-pause').textContent = video.paused ? '▶' : 'Ⅱ';
        $('play-pause').setAttribute('aria-label', video.paused ? 'Play video' : 'Pause video');
        $('mute-video').textContent = video.muted ? '♩' : '♫';
        $('mute-video').setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
        $('time-readout').textContent = `${stamp(video.currentTime)} / ${stamp(video.duration)}`;
        $('timeline').value = Number.isFinite(video.duration) && video.duration > 0
          ? String(Math.round(video.currentTime / video.duration * 1000))
          : '0';
      };

      const showSpinner = (show) => {
        if (!spinner) return;
        spinner.hidden = !show;
      };

      return {
        init: () => {
          video.muted = false;

          video.addEventListener('timeupdate', () => {
            refresh();
            // اگر ویدیو در حال پخشه و زمان جلو می‌ره، اسپینر رو مخفی کن
            if (!video.paused && video.currentTime > 0) showSpinner(false);
          });
          video.addEventListener('loadedmetadata', refresh);
          video.addEventListener('durationchange', refresh);
          video.addEventListener('play', () => { refresh(); showSpinner(false); });
          video.addEventListener('playing', () => showSpinner(false));
          video.addEventListener('pause', refresh);
          video.addEventListener('ended', () => { refresh(); showSpinner(false); });

          // فقط اگر واقعاً بافر کرد، اسپینر نشون بده
          video.addEventListener('waiting', () => showSpinner(true));
          video.addEventListener('stalled', () => showSpinner(true));
          video.addEventListener('canplay', () => showSpinner(false));
          video.addEventListener('canplaythrough', () => showSpinner(false));

          video.addEventListener('error', () => {
            console.error('Video error:', video.error);
            showSpinner(false);
            UI.toast('خطا در پخش ویدیو. لطفاً دوباره تلاش کنید.');
          });

          $('play-pause').addEventListener('click', () => {
            if (video.paused) video.play().catch(() => UI.toast('Unable to play this video.'));
            else video.pause();
          });
          $('skip-back').addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
          $('skip-forward').addEventListener('click', () => {
            if (Number.isFinite(video.duration)) video.currentTime = Math.min(video.duration, video.currentTime + 10);
          });
          $('mute-video').addEventListener('click', () => { video.muted = !video.muted; refresh(); });
          $('timeline').addEventListener('input', e => {
            if (Number.isFinite(video.duration)) video.currentTime = Number(e.target.value) / 1000 * video.duration;
          });
        },
        play: () => { video.play().catch(() => {}); },
        pause: () => { try { video.pause(); } catch (_) {} }
      };
    })();

    /* ============================================================
       UI helpers (modals + toast)
    ============================================================ */
    const UI = (() => {
      let toastTimeout, lastFocus;
      const modals = ['password-modal', 'change-modal', 'viewer-modal'];

      const open = name => {
        lastFocus = document.activeElement;
        modals.forEach(id => $(id).classList.remove('open'));
        const modal = $(`${name}-modal`);
        modal.classList.add('open');
        (modal.querySelector('input:not([type=range])') || modal.querySelector('button'))?.focus();
        if (name === 'viewer') Audio.duckMusic();
      };
      const close = () => {
        const viewer = $('viewer-modal').classList.contains('open');
        modals.forEach(id => $(id).classList.remove('open'));
        if (viewer) { Video.pause(); Audio.unduckMusic(); }
        lastFocus?.focus?.();
      };

      return {
        open, close,
        toast: message => {
          const el = $('toast');
          el.textContent = message;
          el.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => el.classList.remove('show'), 3200);
        },
        openViewer: () => {
          if (State.get() !== 'REVEALED') return;
          open('viewer');
          Video.play();
        },
        init: () => {
          document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', close));
          modals.forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) close(); }));
          document.addEventListener('keydown', e => {
            if (e.key === 'Escape') close();
            if (e.key === 'Tab') {
              const modal = document.querySelector('.modal.open');
              if (!modal) return;
              const focusable = [...modal.querySelectorAll('button:not([hidden]),input:not([hidden])')]
                .filter(el => el.getClientRects().length);
              const first = focusable[0], last = focusable.at(-1);
              if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
              else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
            }
          });
          $('phone').addEventListener('click', () => { Audio.resume(); UI.openViewer(); });
          $('btn-music').addEventListener('click', () => { Audio.resume(); Audio.toggle(); });
          $('btn-key-manage').addEventListener('click', () => open('change'));
          $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          setInterval(() => $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), 60000);
        }
      };
    })();

    /* ============================================================
       Key drag controller
    ============================================================ */
    const KeyController = (() => {
      let dragging = false, originX = 86, originY = 62, grabX = 0, grabY = 0;
      const key = $('key'), glow = $('glow'), layer = $('layer');

      const position = (x, y) => { key.style.left = `${x}%`; key.style.top = `${y}%`; };
      const distance = (x, y) => Math.hypot(x - 50, (y - 66.5) * 2 / 3);
      const reset = () => {
        dragging = false;
        position(originX, originY);
        key.classList.remove('dragging');
        glow.classList.remove('active');
        if (State.get() === 'KEY_VISIBLE') glow.classList.add('pulse');
      };

      return {
        bind: () => {
          key.addEventListener('pointerdown', e => {
            if (State.get() !== 'KEY_VISIBLE') return;
            Audio.resume();
            dragging = true;
            key.setPointerCapture(e.pointerId);
            const r = key.getBoundingClientRect();
            grabX = e.clientX - (r.left + r.width / 2);
            grabY = e.clientY - (r.top + r.height / 2);
            key.classList.add('dragging');
            key.classList.remove('visible');
            e.preventDefault();
          });
          key.addEventListener('pointermove', e => {
            if (!dragging) return;
            const r = layer.getBoundingClientRect();
            const x = (e.clientX - grabX - r.left) / r.width * 100;
            const y = (e.clientY - grabY - r.top) / r.height * 100;
            position(x, y);
            glow.classList.toggle('active', distance(x, y) < 7);
          });
          const release = e => {
            if (!dragging) return;
            dragging = false;
            const r = layer.getBoundingClientRect();
            const x = (e.clientX - grabX - r.left) / r.width * 100;
            const y = (e.clientY - grabY - r.top) / r.height * 100;
            glow.classList.remove('active');
            if (distance(x, y) < 9) UnlockSequence.start();
            else { key.classList.remove('dragging'); key.classList.add('visible'); reset(); }
          };
          key.addEventListener('pointerup', release);
          key.addEventListener('pointercancel', () => { key.classList.add('visible'); reset(); });
          key.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ' ') && State.get() === 'KEY_VISIBLE') {
              e.preventDefault();
              UnlockSequence.start();
            }
          });
        },
        show: () => {
          if (isAutoUnlockWindow()) return;
          position(originX, originY);
          key.classList.remove('snapping', 'rotating', 'gone', 'dragging');
          key.classList.add('visible');
          key.tabIndex = 0;
          glow.classList.add('pulse');
        },
        hide: () => {
          dragging = false;
          key.classList.remove('visible', 'dragging', 'snapping', 'rotating', 'gone');
          key.style.left = ''; key.style.top = '';
          key.tabIndex = -1;
          glow.classList.remove('pulse', 'active', 'burst');
        }
      };
    })();

    /* ============================================================
       Unlock cinematic sequence
    ============================================================ */
    const UnlockSequence = (() => {
      let token = 0;
      const phone = $('phone'), key = $('key'), glow = $('glow');
      return {
        start: async () => {
          if (!State.set('KEY_INSERTED')) return;
          const id = ++token;
          const valid = () => id === token && State.get() !== 'LOCKED';

          glow.classList.remove('pulse', 'active');
          key.classList.remove('visible', 'dragging', 'rotating', 'gone');
          key.classList.add('snapping');
          key.style.left = '50%'; key.style.top = '66.5%';
          Audio.sfx.insert();
          await sleep(500); if (!valid()) return;

          State.set('KEY_ROTATING');
          Audio.sfx.rotate();
          void key.offsetWidth;
          key.classList.add('rotating');
          await sleep(950); if (!valid()) return;

          key.classList.remove('rotating');
          key.classList.add('gone');
          await sleep(450); if (!valid()) return;

          State.set('OPENING');
          glow.classList.add('burst');
          Audio.sfx.unlock();
          $('layer').animate(
            [{ transform: 'translateX(0)' }, { transform: 'translateX(-.2%)' },
             { transform: 'translateX(.2%)' }, { transform: 'translateX(0)' }],
            { duration: 400, iterations: 1 });
          await sleep(600); if (!valid()) return;

          phone.classList.add('reveal');
          Audio.sfx.magic();
          await sleep(2200); if (!valid()) return;

          phone.classList.remove('reveal');
          phone.classList.add('done');
          State.set('REVEALED');
          sessionStorage.setItem(CFG.SESSION_KEY, 'true');
          $('btn-lock').innerHTML = lockOpen;
          $('btn-lock').setAttribute('aria-label', 'Relock surprise');
          $('btn-key-manage').hidden = false;
          KeyController.hide();
          UI.toast('Your surprise is ready ♡');
        },
        reset: () => {
          token++;
          phone.classList.remove('reveal', 'done');
          phone.style.opacity = '0';
          phone.style.pointerEvents = 'none';
          glow.classList.remove('pulse', 'active', 'burst');
          glow.style.opacity = '0';
        }
      };
    })();

    /* ============================================================
       Reveal / relock
    ============================================================ */
    const revealImmediately = () => {
      for (const value of ['KEY_VISIBLE', 'KEY_INSERTED', 'KEY_ROTATING', 'OPENING', 'REVEALED']) State.set(value);
      $('phone').classList.remove('reveal');
      $('phone').classList.add('done');
      $('phone').style.opacity = '1';
      $('phone').style.pointerEvents = 'auto';
      $('btn-lock').innerHTML = lockOpen;
      $('btn-lock').setAttribute('aria-label', isAutoUnlockWindow() ? 'Open secret settings' : 'Relock surprise');
      $('btn-key-manage').hidden = false;
      $('auto-badge').hidden = !isAutoUnlockWindow();
      KeyController.hide();
    };

    function relock() {
      if (isAutoUnlockWindow()) return;
      sessionStorage.removeItem(CFG.SESSION_KEY);
      State.set('LOCKED');
      KeyController.hide();
      UnlockSequence.reset();
      $('btn-lock').innerHTML = lockClosed;
      $('btn-lock').setAttribute('aria-label', 'Open secret password');
      $('btn-key-manage').hidden = true;
      $('auto-badge').hidden = true;
      UI.close();
      Video.pause();
    }

    /* ============================================================
       Password flow
    ============================================================ */
    const Password = (() => {
      const secret = () => localStorage.getItem(CFG.SECRET_KEY) || CFG.DEFAULT_SECRET;
      return {
        init: () => {
          $('btn-lock').addEventListener('click', () => {
            Audio.resume(); Audio.sfx.click();
            if (isAutoUnlockWindow()) {
              UI.open('password');
              $('password-form').hidden = true;
              $('password-help').textContent = 'Your birthday surprise is already open!';
              $('password-change').hidden = false;
              $('reset-password').hidden = true;
              return;
            }
            if (State.get() === 'REVEALED' || State.get() === 'KEY_VISIBLE') { relock(); return; }
            UI.open('password');
            $('password-form').hidden = false;
            $('password-help').textContent = 'Enter the secret to discover what is waiting inside.';
            $('password-change').hidden = true;
            $('reset-password').hidden = false;
            $('pw-input').value = '';
            $('pw-error').classList.remove('show');
          });

          $('password-form').addEventListener('submit', e => {
            e.preventDefault();
            if ($('pw-input').value === secret()) {
              UI.close();
              if (State.set('KEY_VISIBLE')) {
                KeyController.show();
                UI.toast('A golden key has appeared ♡');
              }
            } else {
              const dialog = $('password-modal .dialog');
              $('pw-error').classList.add('show');
              dialog.classList.remove('shake');
              void dialog.offsetWidth;
              dialog.classList.add('shake');
            }
          });

          $('reset-password').addEventListener('click', () => {
            localStorage.removeItem(CFG.SECRET_KEY);
            location.reload();
          });

          $('password-change').addEventListener('click', () => UI.open('change'));

          $('change-form').addEventListener('submit', e => {
            e.preventDefault();
            if ($('current-secret').value !== secret()) {
              $('change-error').classList.add('show');
              return;
            }
            const next = $('new-secret').value;
            if (next.length < 4) {
              $('change-error').textContent = 'Use at least 4 characters.';
              $('change-error').classList.add('show');
              return;
            }
            localStorage.setItem(CFG.SECRET_KEY, next);
            $('change-form').reset();
            $('change-error').classList.remove('show');
            UI.close();
            UI.toast('Secret updated successfully ✓');
          });
        }
      };
    })();

    /* ============================================================
       Phase manager — applies the correct UI state on load & on change
    ============================================================ */
    const PhaseManager = (() => {
      let lastPhase = null;

      const apply = (announce = false) => {
        const schedule = getScheduleState();
        const phase = schedule.phase;
        if (phase === lastPhase) return;
        lastPhase = phase;

        document.body.classList.toggle('phase-window', phase === 'WINDOW');
        document.body.classList.toggle('phase-after',  phase === 'AFTER');

        if (phase === 'WINDOW') {
          revealImmediately();
          if (announce) UI.toast('🎉 Birthday window is live! Enjoy your surprise.');
        } else if (phase === 'AFTER') {
          relock();
          sessionStorage.removeItem(CFG.SESSION_KEY);
          if (announce) UI.toast('The surprise is sealed until next year ♡');
        } else {
          if (sessionStorage.getItem(CFG.SESSION_KEY) === 'true') {
            revealImmediately();
          } else {
            $('btn-lock').innerHTML = lockClosed;
            $('btn-lock').setAttribute('aria-label', 'Open secret password');
          }
        }
      };

      return {
        init: () => apply(false),
        tick: () => apply(true)
      };
    })();

    /* ============================================================
       Boot
    ============================================================ */
    async function boot() {
      Audio.init();
      Countdown.init();
      KeyController.bind();
      Video.init();
      UI.init();
      Password.init();
      PhaseManager.init();

      setInterval(() => PhaseManager.tick(), 30000);

      document.addEventListener('pointerdown', () => Audio.resume(), { once: true });
      document.addEventListener('keydown', () => Audio.resume(), { once: true });
    }
    boot().catch(error => console.error('Birthday surprise could not start:', error));
  </script>
</body>
</html>
